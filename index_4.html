<!DOCTYPE html>
<html lang="en">

  <body>
    <script src="my_4.js"></script>

    <!-- Q #3:  Display this in your browser -->
    <script>
      document.write("<h1>Rules for naming JS variables</h1>");

      document.write(
        "<p>Variable names can only contain letters, numbers, $ and _ . "
      );
      document.write("For example $my_1stVariable</p>");

      document.write("<p>Variables must begin with a letter, $ or _ . ");
      document.write("For example $name, _name or name</p>");

      document.write("<p>Variable names are case sensitive</p>");

      document.write("<p>Variable names should not be JS keywords</p>");
    </script>
  </body>
</html>
